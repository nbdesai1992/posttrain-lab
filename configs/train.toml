# The planned runs for the first training target, reasoning without the wait.
#
# Every run trains one LoRA adapter on one saved set from results/data/sets.json, with
# examples rendered for the fast setting and the answer alone as the target. Rank and
# learning rate were fixed by the pilot (configs/train-pilot.toml) and are the same
# for every run. Updates are sized in training tokens, so sets that are matched on
# tokens get the same number of updates: 252 at the size of 2,000 middle-band items.
# The learning rate falls linearly to zero over a run.
#
# The main comparison, middle band against random, has three seeds. A seed changes
# the adapter's starting weights, the order of the batches and the draw of the data:
# seed 1 trains on the nested sets `middle-2000` and `random-2000`, and seeds 2 and 3
# on their own draws of both. The other runs use seed 1.
#
# The runs are listed in the order they train: the main comparison, then the
# controls, then the size sweep.

model_id = "thinkingmachines/Inkling-2-Mini:peft:65536:free"
seed = 1
rank = 16
learning_rate = 1.8e-4
tokens_per_update = 3500                # about 32 middle-band items
epochs = 4
updates_per_call = 16
checkpoint_ttl_days = 30                # one sampler checkpoint per run, and no others
max_checkpoints = 90                    # the service stores at most 100 per organisation
runs_per_process = 1                    # a third training client from one process waits in the queue for a long time; scripts/train_all.sh starts a process per run

# What happened while the runs trained, for PROGRESS.md and the report.
notes = [
    "Adapters are evaluated while later runs train, at 16 requests in flight. The evaluation first ran at 32 in flight, from 04:27 to 05:10 UTC on 2026-11-27, for the prompt-only state and the main adapter's fast pass. Over that stretch an update took 9.9 s on average, against 8.0 s for the 344 updates made without it up to 05:53 UTC. That is 24% slower, with an interval from 8% faster to 67% slower when groups of 16 updates are resampled. The median update did not change, and the service reported no rate-limit pause during updates. The evaluation was stopped from 05:10 to 05:56 UTC to measure training alone, and then started again at half the concurrency. It goes back to after training if 500 or more updates made beside it average more than a quarter above 8.0 s, or if the service reports a rate-limit pause during updates.",
    "Every run trains in its own process. The third run started in the first process sat in the service's queue for seven minutes, with `paused_rate_limit` reported 13 times and no update made, as the third pilot run had. The process was stopped at 05:41 UTC and the run began two minutes into a fresh one. A run still waits about two minutes in the queue before its first update.",
]


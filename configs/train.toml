# The planned runs for the first training target, reasoning without the wait.
#
# Every run trains one LoRA adapter on one saved set from results/data/sets.json, with
# examples rendered for the fast setting and the answer alone as the target. Rank and
# learning rate were fixed by the pilot (configs/train-pilot.toml) and are the same
# for every run. Updates are sized in training tokens, so sets that are matched on
# tokens get the same number of updates: 252 at the size of 2,000 middle-band items.
# The learning rate falls linearly to zero over a run.
#
# The main comparison, middle band against random, has three seeds. A seed changes
# the adapter's starting weights, the order of the batches and the draw of the data:
# seed 1 trains on the nested sets `middle-2000` and `random-2000`, and seeds 2 and 3
# on their own draws of both. The other runs use seed 1.
#
# The runs are listed in the order they train: the main comparison, then the
# controls, then the size sweep.

model_id = "thinkingmachines/Inkling-2-Mini:peft:65536:free"
seed = 1
rank = 16
learning_rate = 1.8e-4
tokens_per_update = 3500                # about 32 middle-band items
epochs = 4
updates_per_call = 16
checkpoint_ttl_days = 30                # one sampler checkpoint per run, and no others
max_checkpoints = 90                    # the service stores at most 100 per organisation

[client]
max_concurrency = 16
call_timeout_s = 1800

[[runs]]
name = "middle-2000-s1"
set = "middle-2000"
seed = 1

[[runs]]
name = "random-2000-s1"
set = "random-2000"
seed = 1

[[runs]]
name = "middle-2000-s2"
set = "middle-2000-draw2"
seed = 2

[[runs]]
name = "random-2000-s2"
set = "random-2000-draw2"
seed = 2

[[runs]]
name = "middle-2000-s3"
set = "middle-2000-draw3"
seed = 3


# Candidate training problems for the reasoning target. Each list gives how many
# problems to generate at levels 1 to 5 of a family. No model is called.

seed = 20261126
survey_seed = 20261126   # the seed the survey sampled its benchmarks with
ngram = 5                # character n-grams for the similarity check
threshold = 0.5          # drop a candidate at or above this Jaccard similarity to any benchmark question

# The rule for the counts: 150 candidates for each family and level; 300 at level 1 for
# the six families whose level 1 the fast setting nearly always solves, to fill the
# easy cell; and more at levels 6 and 7 to fill the hard cell, where most problems
# outrun the reasoning setting's token limit. The sizes come from two small trial runs.
# Easy items are short, so matching the tokens of 2,000 middle-band items takes close
# to 2,800 of them.
#
# Three things are left out. The table family stops at level 5 because its longer
# tables run to 500 tokens and more per item and would take a third of the middle
# band's tokens. Three entries are 24 because the leak check drops their wording
# altogether. And calendar levels 1 and 2 were first run with 400 candidates each, on
# a trial that suggested a third of them would be easy. Under the final wording 9% were,
# which made the family a fifth of the middle band, so they were cut back to the first
# 150 of each.
[counts]
arithmetic = [300, 150, 150, 150, 150, 150, 370]
stock_story = [300, 150, 150, 150, 150, 0, 0]
rates = [150, 150, 150, 150, 150, 0, 0]
sequence = [150, 150, 150, 150, 150, 100, 370]
number_theory = [300, 24, 150, 150, 150, 150, 370]
table = [300, 150, 150, 150, 150, 0, 0]
code_trace = [150, 150, 150, 150, 150, 220, 220]
calendar = [150, 150, 150, 150, 150, 200, 100]
counting = [300, 150, 150, 150, 150, 230, 220]
equations = [24, 24, 150, 150, 150, 100, 370]
ordering = [300, 150, 150, 150, 150, 0, 0]
